name: Self-built Windows and macOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-built-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            runner: windows-2022
            qt-arch: win64_msvc2022_64
          - name: macos-arm64
            runner: macos-15
            qt-arch: clang_64

    steps:
      - name: Checkout source and version tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.target.qt-arch }}
          cache: true
          cache-key-prefix: self-built-${{ matrix.target.name }}-${{ env.QT_VERSION }}

      - name: Checkout fixed Windows dependency registry
        if: runner.os == 'Windows'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489 # 2026.10.16
          path: .ci-deps/vcpkg
          persist-credentials: false

      - name: Build Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.ci-deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.ci-deps/vcpkg/vcpkg.exe install openssl:x64-windows-release --classic --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.ci-deps/vcpkg/installed/x64-windows-release/bin" >> $env:GITHUB_PATH

      - name: Install macOS OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DBUILD_INSTALLER=OFF `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/.ci-deps/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_MANIFEST_MODE=OFF `
            -DOPENSSL_ROOT_DIR="$env:GITHUB_WORKSPACE/.ci-deps/vcpkg/installed/x64-windows-release"

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DBUILD_INSTALLER=OFF \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      # BUILD_MICROPHONE_FOLLOW retains the project's default OFF. It can be
      # built separately with Qt Multimedia when that optional feature is needed.
      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2 --timeout 120 --output-junit "${{ github.workspace }}/build/test-results.xml"

      - name: Stage Windows runtime and smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --prefix staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimeDirs = @(Get-ChildItem -Path "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT" -Directory)
          if ($runtimeDirs.Count -eq 0) { throw 'MSVC runtime directory not found' }
          foreach ($runtimeDir in $runtimeDirs) {
            Copy-Item -Path "$($runtimeDir.FullName)/*.dll" -Destination staging
          }
          $env:PATH = "$env:GITHUB_WORKSPACE/staging;$env:SystemRoot/System32;$env:SystemRoot"
          & ./staging/deskflow-core.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gui = Start-Process -FilePath "$env:GITHUB_WORKSPACE/staging/deskflow.exe" -ArgumentList '--version' -Wait -PassThru -WindowStyle Hidden
          if ($gui.ExitCode -ne 0) { throw "GUI smoke test failed: $($gui.ExitCode)" }

      - name: Stage macOS runtime and smoke test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/staging"
          macdeployqt "$PWD/staging/Deskflow.app" \
            "-executable=$PWD/staging/Deskflow.app/Contents/MacOS/deskflow-core" -codesign=-
          codesign --verify --deep --strict staging/Deskflow.app
          env -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH staging/Deskflow.app/Contents/MacOS/deskflow-core --version
          env -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH staging/Deskflow.app/Contents/MacOS/Deskflow --version

      - name: Record artifact identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $openssl = if ($env:RUNNER_OS -eq 'Windows') {
            (& ./.ci-deps/vcpkg/vcpkg.exe list openssl) -join "`n"
          } else {
            brew list --versions openssl@3
          }
          $identity = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit = (git rev-parse HEAD)
            describe = (git describe --tags --always --dirty)
            target = '${{ matrix.target.name }}'
            qt = $env:QT_VERSION
            openssl = $openssl
            microphoneFollow = $false
            runner = $env:RUNNER_OS
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          $identity | ConvertTo-Json | Set-Content staging/build-info.json
          Copy-Item staging/build-info.json dist/build-info.json

      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging/* -DestinationPath "dist/deskflow-${{ matrix.target.name }}-${{ github.sha }}.zip"

      - name: Archive macOS runtime preserving bundle permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent staging/Deskflow.app "dist/deskflow-${{ matrix.target.name }}-${{ github.sha }}.zip"

      - name: Hash runtime archive
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-built-tests-${{ matrix.target.name }}-${{ github.sha }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload runtime archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-built-${{ matrix.target.name }}-${{ github.sha }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
