name: Self-built Windows and macOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-built-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  QT_QPA_PLATFORM: offscreen
  DOTNET_ROLL_FORWARD: Major

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            runner: windows-2022
            qt-arch: win64_msvc2022_64
          - name: macos-arm64
            runner: macos-15
            qt-arch: clang_64

    steps:
      - name: Checkout source and version tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.target.qt-arch }}
          modules: qtmultimedia
          cache: true
          cache-key-prefix: self-built-multimedia-${{ matrix.target.name }}-${{ env.QT_VERSION }}

      - name: Checkout fixed Windows dependency registry
        if: runner.os == 'Windows'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489 # 2026.10.16
          path: .ci-deps/vcpkg
          persist-credentials: false

      - name: Build Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.ci-deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.ci-deps/vcpkg/vcpkg.exe install openssl:x64-windows-release --classic --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.ci-deps/vcpkg/installed/x64-windows-release/bin" >> $env:GITHUB_PATH

      - name: Install macOS OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      # WiX 4 is the CPack-supported toolchain; pin tool and all extensions together.
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($extension in 'UI', 'Util', 'Firewall') {
            wix extension add --global "WixToolset.$extension.wixext/4.0.6"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Record public build identity
        shell: pwsh
        run: |
          $openssl = if ($env:RUNNER_OS -eq 'Windows') {
            (& ./.ci-deps/vcpkg/vcpkg.exe list openssl --classic) -join "`n"
          } else {
            brew list --versions openssl@3
          }
          if ($LASTEXITCODE -ne 0 -or !$openssl) { throw 'OpenSSL identity unavailable' }
          $python = if ($env:RUNNER_OS -eq 'Windows') { 'python' } else { 'python3' }
          & $python .github/scripts/package_identity.py record --target '${{ matrix.target.name }}' `
            --openssl "$openssl" --output "$env:GITHUB_WORKSPACE/build-info.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test artifact verification boundaries
        shell: pwsh
        run: |
          $python = if ($env:RUNNER_OS -eq 'Windows') { 'python' } else { 'python3' }
          & $python .github/scripts/test_package_verification.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DBUILD_INSTALLER=ON -DBUILD_MICROPHONE_FOLLOW=ON `
            -DDESKFLOW_BUILD_INFO_FILE="$env:GITHUB_WORKSPACE/build-info.json" `
            -DPACKAGE_VERSION_LABEL='${{ github.sha }}' `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/.ci-deps/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_MANIFEST_MODE=OFF `
            -DOPENSSL_ROOT_DIR="$env:GITHUB_WORKSPACE/.ci-deps/vcpkg/installed/x64-windows-release"

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DBUILD_INSTALLER=ON -DBUILD_MICROPHONE_FOLLOW=ON \
            -DDESKFLOW_BUILD_INFO_FILE="$PWD/build-info.json" \
            -DPACKAGE_VERSION_LABEL='${{ github.sha }}' \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Verify microphone build configuration
        shell: pwsh
        run: |
          $python = if ($env:RUNNER_OS -eq 'Windows') { 'python' } else { 'python3' }
          & $python .github/scripts/package_identity.py verify-config --cache build/CMakeCache.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2 --timeout 120 --output-junit "${{ github.workspace }}/build/test-results.xml"

      - name: Package and verify Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build --prefix "$env:GITHUB_WORKSPACE/staging"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimeDirs = @(Get-ChildItem -Path "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT" -Directory)
          if ($runtimeDirs.Count -eq 0) { throw 'MSVC runtime directory not found' }
          foreach ($runtimeDir in $runtimeDirs) {
            Copy-Item -Path "$($runtimeDir.FullName)/*.dll" -Destination staging
          }
          python .github/scripts/package_identity.py verify-tree --target windows-x64 --root staging --identity build-info.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config build/CPackConfig.cmake -G ZIP -B dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config build/CPackConfig.cmake -G WIX -B dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zips = @(Get-ChildItem dist/*.zip)
          $msis = @(Get-ChildItem dist/*.msi)
          if ($zips.Count -ne 1 -or $msis.Count -ne 1) { throw 'Expected exactly one ZIP and MSI' }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath package-check/portable
          python .github/scripts/package_identity.py verify-tree --target windows-x64 --root package-check/portable --identity build-info.json --portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Administrative extraction on the disposable runner; no service/product installation.
          # MSI's TARGETDIR parser rejects forward slashes even though PowerShell accepts them.
          $msiRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'package-check/msi'))
          $msiLog = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'build/msi-extraction.log'))
          New-Item -ItemType Directory -Path $msiRoot -Force | Out-Null
          $extract = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msis[0].FullName)`"", '/qn', "TARGETDIR=`"$msiRoot`"", '/L*v', "`"$msiLog`"") -PassThru -Wait -WindowStyle Hidden
          if ($extract.ExitCode -ne 0) { throw "MSI extraction failed: $($extract.ExitCode)" }
          python .github/scripts/package_identity.py verify-tree --target windows-x64 --root $msiRoot --identity build-info.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-info.json dist/build-info.json

      - name: Package and verify macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix "$PWD/staging"
          python3 .github/scripts/package_identity.py verify-tree --target macos-arm64 --root staging --identity build-info.json
          mkdir -p dist package-check/zip package-check/dmg
          ditto -c -k --sequesterRsrc --keepParent staging/Deskflow.app "dist/deskflow-${GITHUB_SHA}-macos-arm64.zip"
          ditto -x -k "dist/deskflow-${GITHUB_SHA}-macos-arm64.zip" package-check/zip
          python3 .github/scripts/package_identity.py verify-tree --target macos-arm64 --root package-check/zip --identity build-info.json
          cpack --config build/CPackConfig.cmake -G DragNDrop -B dist
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -eq 1
          # The image embeds this project's GPL; acknowledge it for the CI-only read-only mount.
          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "$PWD/package-check/dmg" <<< 'Y'
          trap 'hdiutil detach "$PWD/package-check/dmg"' EXIT
          python3 .github/scripts/package_identity.py verify-tree --target macos-arm64 --root package-check/dmg --identity build-info.json
          hdiutil detach "$PWD/package-check/dmg"
          trap - EXIT
          cp build-info.json dist/build-info.json

      - name: Hash every public package asset
        shell: pwsh
        run: |
          # CPack also writes working directories and debug symbol files; publish only reviewed assets.
          Get-ChildItem dist -File | Where-Object { $_.Extension -notin '.zip', '.msi', '.dmg', '.json' } | Remove-Item
          $python = if ($env:RUNNER_OS -eq 'Windows') { 'python' } else { 'python3' }
          & $python .github/scripts/package_identity.py manifest --root dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-built-tests-${{ matrix.target.name }}-${{ github.sha }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/msi-extraction.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload verified native packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-built-${{ matrix.target.name }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.dmg
            dist/build-info.json
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
